name: bot-simulado
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python bot.py --una-vez
      - name: Guardar estado
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "actualiza bot" && git push)

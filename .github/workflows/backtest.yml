name: backtest-ra
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python backtest.py
      - name: Guardar informe
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add informe_backtest.md operaciones_backtest.csv
          git diff --staged --quiet || (git commit -m "informe backtest" && git pull --rebase && git push)
